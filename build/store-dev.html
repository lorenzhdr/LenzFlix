<!doctype html>
<html lang="de" class="lfx-js lfx-theme-store">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VIDEOTHEK LENZ · Dev-Harness</title>
  <!-- Dev-Harness für das 3D-Bundle ohne Jellyfin. Start: npm run build && npm run serve → http://localhost:5179/store-dev.html
       Parameter: ?touch=1&phone=1 (Handy simulieren), ?quality=auto|low|mid|high, ?n=900 (Titelzahl), ?item=m12, ?restore=1,
       ?intro=1 (Intro-Rollladen abspielen, sonst übersprungen), ?hour=22 (Uhrzeit erzwingen), ?rain=1|0 (Regen erzwingen), ?sound=0 (Ton aus; Standard an) -->
  <link rel="stylesheet" href="/dist/lenzstore.css">
  <style>
    html, body { margin: 0; height: 100%; background: #0d1330; color: #f4f6ff; font-family: system-ui, sans-serif; }
    #dev-load { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1300; text-align: center; font-size: 14px; }
    #dev-load div { width: 260px; height: 6px; margin-top: 8px; background: #232f6c; border-radius: 3px; overflow: hidden; }
    #dev-load i { display: block; height: 100%; width: 0; background: #ffd23f; transition: width .2s; }
    #dev-toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); z-index: 1400; padding: 8px 16px; border-radius: 999px; background: #141c48; border: 1px solid #2f3d86; display: none; }
    #dev-fatal { position: fixed; inset: 0; z-index: 1500; display: none; align-items: center; justify-content: center; background: #070a1c; padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <div class="lfx-store-stage" id="stage"></div>
  <div id="dev-load"><span id="dev-load-text">Lade …</span><div><i id="dev-load-bar"></i></div></div>
  <div id="dev-toast"></div>
  <div id="dev-fatal"></div>
  <script src="/dist/lenzstore.js"></script>
  <script src="/store-dev.js"></script>
</body>
</html>
